[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read", path = "./art" }]

[fuzz]
runs = 512

[lint]
lint_on_build = false # forge 1.8's linter needs >10 GB on this suite; Ultrafuzz box
